<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NHSE for Mac</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;color:#263528;background:#f3f7f2}body{margin:0}.wrap{max-width:1100px;margin:32px auto;padding:28px;background:#fff;border-radius:18px;box-shadow:0 6px 26px #24502a18}h1{color:#247348;margin:0 0 8px}h2{font-size:21px}.muted{color:#647468;font-size:14px}label{display:block;font-weight:600;margin:12px 0 6px}input,select{box-sizing:border-box;width:100%;min-height:39px;padding:8px;border:1px solid #b8caba;border-radius:7px;font:inherit;background:white}button{font:inherit;padding:9px 15px;border:0;border-radius:8px;background:#287a4d;color:white;cursor:pointer}button:disabled{opacity:.5;cursor:default}.top{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:end}.tabs{display:flex;gap:8px;border-bottom:1px solid #dce5dc;margin:25px 0 16px;padding-bottom:9px}.tabs button{background:#eaf2eb;color:#225c38}.tabs button.active{background:#287a4d;color:white}.hidden{display:none!important}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(225px,1fr));gap:16px}.field{background:#f7faf7;padding:12px;border-radius:9px}.field label{margin:0 0 6px;word-break:break-word}.field small{color:#738075}.field input,.field select{margin-top:6px}.bar{display:flex;gap:12px;align-items:center;margin:20px 0}.bar select{max-width:220px}.bar input{max-width:180px}table{border-collapse:collapse;width:100%;font-size:14px}th,td{border-bottom:1px solid #e1e8e1;padding:7px;text-align:left}td input{min-height:32px;padding:5px;width:100px}td:first-child{width:60px}#message{white-space:pre-wrap;background:#e9f4eb;padding:12px;border-radius:8px;margin-top:15px}#message.error{background:#feecec;color:#9b2525}.secondary{background:#eaf2eb;color:#225c38}.savebar{position:sticky;bottom:0;background:white;border-top:1px solid #dce5dc;padding:14px 0;display:flex;align-items:center;gap:14px}.villager-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px}.villager-card{border:1px solid #dce5dc;border-radius:10px;padding:13px;background:#fbfdfb}.villager-card summary{cursor:pointer;display:flex;align-items:center;gap:10px;font-weight:700}.villager-card summary small{color:#738075;font-weight:400}.villager-card[open]{background:#fff}.villager-card-fields{padding-top:8px}
</style>
<div class="wrap"><h1>🍃 NHSE for Mac</h1><p class="muted">本机网页存档编辑器。修改会另存为一份新存档，原文件保留。</p>
<div class="top"><div><label for="path">存档文件夹路径</label><input id="path" placeholder="可粘贴带单引号或双引号的路径"></div><button id="pickFolder" type="button">选择文件夹…</button><button id="inspect">读取存档</button></div><div id="message" class="hidden" role="status" aria-live="polite"></div>
<section id="editor" class="hidden"><div class="bar"><h2 id="island" style="margin-right:auto"></h2><label for="player">玩家</label><select id="player"></select></div>
<div class="tabs"><button class="active" data-tab="fields">玩家与岛屿</button><button data-tab="villagers">村民</button><button data-tab="items">物品格</button><button data-tab="recipes">DIY 配方</button></div>
<div id="fieldsPanel"><p class="muted">这里只显示常用玩家与岛屿设置。</p><button id="resetFields" class="secondary" type="button">恢复本页原状</button><div id="fieldGroups"></div></div>
<div id="villagersPanel" class="hidden"><div class="bar"><h2 style="margin-right:auto">岛上村民</h2><button id="resetVillager" class="secondary" type="button">恢复全部村民原状</button></div><p class="muted">所有村民和空位都会列在这里。点开卡片可编辑种类、性格、口头禅和搬离状态。</p><div id="villagerFields" class="villager-list"></div></div>
<div id="itemsPanel" class="hidden"><div class="bar"><label for="inventory">物品区域</label><select id="inventory"><option value="Pocket">口袋</option><option value="Bag">背包</option><option value="ItemChest">仓库</option><option value="RecycleBin">回收箱</option></select><label for="page">页码</label><select id="page"></select><button id="resetInventory" class="secondary" type="button">恢复本页原状</button></div><p class="muted">可堆叠物品显示数量，工具显示耐久；其他物品不适用的数值不会显示。</p><table><thead><tr><th>格子</th><th>物品名称</th><th>物品 ID</th><th>数量（可堆叠物品）</th><th>耐久（工具）</th></tr></thead><tbody id="itemRows"></tbody></table></div>
<div id="recipesPanel" class="hidden"><div class="bar"><label for="recipeSearch">搜索配方</label><input id="recipeSearch" type="search" placeholder="输入配方名称或编号"><button id="expandRecipes" type="button">显示全部</button></div><div class="bar"><label for="recipeBulkField">批量操作</label><select id="recipeBulkField"><option value="known">已学会</option><option value="made">已制作</option><option value="new">新配方</option><option value="favorite">收藏</option></select><button id="recipeSelectAll" type="button">全选</button><button id="recipeInvert" type="button">反选</button><button id="recipeClear" type="button">全不选</button><button id="resetRecipes" class="secondary" type="button">恢复本页原状</button></div><p class="muted">批量操作会应用到当前搜索结果；搜索框留空时应用到全部配方。</p><table><thead><tr><th>配方名称</th><th>编号</th><th>已学会</th><th>已制作</th><th>新配方</th><th>收藏</th></tr></thead><tbody id="recipeRows"></tbody></table></div>
<div class="savebar"><button id="save">保存为新存档</button><span id="changeCount" class="muted">尚无改动</span></div><p class="muted">新存档不会覆盖源文件。若要用新档替换游戏存档，请先备份旧存档；导入前请退出游戏。</p></section></div>
<script>
const $=id=>document.getElementById(id);let basic=null,data=null,fieldsChanged=new Map(),itemsChanged=new Map(),recipesChanged=new Map();const names={Personal:'玩家',Main:'岛屿',Data30:'3.0 追加数据',WhereAreN:'快乐家乐园'};const labels={PlayerName:'玩家名字',TownName:'岛名',Wallet:'口袋铃钱',Bank:'银行存款',NookMiles:'Nook 里数',TotalNookMiles:'累计里数',PocketCount:'口袋格数',BagCount:'背包格数',ItemChestCount:'仓库格数',HotelTickets:'酒店券',Poki:'波奇',Hemisphere:'半球',AirportThemeColor:'机场颜色',WeatherSeed:'天气随机种子',TourWeatherSeed:'旅游岛天气种子',CampsiteStatus:'露营地状态',CampsiteVillagerVariantID:'露营村民变种编号',CampsiteVillagerSpeciesID:'露营村民种类',OutsideFieldTemplateUniqueId:'岛屿模板编号',MainFieldParamUniqueID:'岛屿参数编号',EventPlazaLeftUpX:'活动广场横坐标',EventPlazaLeftUpZ:'活动广场纵坐标',SpecialtyFruit:'岛屿特产水果',SisterFruit:'姐妹水果',SpecialtyFlower:'岛屿特产花',SisterFlower:'姐妹花',ProfileFruit:'玩家资料水果',Species:'种类',Variant:'变种',Personality:'性格',CatchPhrase:'口头禅',BirthType:'出生状态',InducementType:'邀请状态',MoveType:'搬家状态',MovingOut:'正在搬离',DIYRecipeIndex:'DIY 配方编号'};
function msg(text,error=false){$('message').textContent=text;$('message').className=error?'error':''}
async function post(url,payload){const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});const x=await r.json();if(!r.ok)throw Error(x.error||'请求失败');return x}
const lastPath=localStorage.getItem('nhse-last-save-path');if(lastPath)$('path').value=lastPath;
$('pickFolder').onclick=async()=>{try{const r=await fetch('/api/pick-folder');const x=await r.json();if(!r.ok)throw Error(x.error||'无法选择文件夹');if(!x.cancelled){$('path').value=x.path;localStorage.setItem('nhse-last-save-path',x.path)}}catch(e){msg(e.message,true)}};
$('inspect').onclick=async()=>{const button=$('inspect');button.disabled=true;button.textContent='读取中…';msg('正在读取存档…');try{basic=await post('/api/inspect',{path:$('path').value});$('path').value=basic.path;localStorage.setItem('nhse-last-save-path',basic.path);$('island').textContent=basic.island+' · '+basic.players.length+' 位玩家';$('player').replaceChildren(...basic.players.map(p=>new Option(p.name,p.index)));await loadPlayer();$('editor').classList.remove('hidden');msg(basic.invalidHashes?'读取成功：'+basic.island+'，'+basic.players.length+' 位玩家。发现 '+basic.invalidHashes+' 个校验异常，保存已禁用。':'读取成功：'+basic.island+'，'+basic.players.length+' 位玩家，存档校验正常。')}catch(e){$('editor').classList.add('hidden');msg('读取失败：'+e.message,true)}finally{button.disabled=false;button.textContent='读取存档'}};
$('player').onchange=()=>loadPlayer().catch(e=>msg('读取玩家数据失败：'+e.message,true));
async function loadPlayer(){fieldsChanged.clear();itemsChanged.clear();recipesChanged.clear();data=await post('/api/editor',{path:basic.path,player:Number($('player').value)});renderFields();renderVillager();renderInventory();renderRecipes();count()}
function renderFieldGroups(containerId,sourceFields,hideGroupTitle=false){const container=containerId instanceof Element?containerId:$(containerId),groups={};for(const f of sourceFields)(groups[f.key.split('.')[0]]??=[]).push(f);container.replaceChildren();for(const [group,fields] of Object.entries(groups)){const section=document.createElement('section');if(!hideGroupTitle){const h=document.createElement('h3');h.textContent=names[group]||group;section.append(h)}const grid=document.createElement('div');grid.className='grid';for(const f of fields){const box=document.createElement('div');box.className='field';const label=document.createElement('label');label.textContent=labels[f.key.split('.')[1]]||f.key.split('.')[1];const small=document.createElement('small');small.textContent=f.key+(f.display&&f.display!==f.value?' · '+f.display:'');let input;if(f.kind==='enum'||f.kind==='villagerSpecies'||f.kind==='fruit'){input=document.createElement('select');if(f.kind==='enum'){for(const opt of f.options)input.add(new Option(({Northern:'北半球',Southern:'南半球',Blue:'蓝色',Yellow:'黄色',Orange:'橙色',Green:'绿色',Lazy:'悠闲',Jock:'运动',Cranky:'暴躁',Smug:'自恋',Normal:'普通',Peppy:'元气',Snooty:'成熟',Uchi:'大姐姐',Windflower:'银莲花',Hyacinth:'风信子',Tulip:'郁金香',Rose:'玫瑰',Cosmos:'波斯菊',Lily:'百合',Mums:'菊花',Pansy:'三色堇'})[opt]||opt,opt))}else if(f.kind==='villagerSpecies'){for(const opt of f.speciesOptions)input.add(new Option(opt.label,opt.value))}else{for(const opt of f.fruitOptions)input.add(new Option(opt.label,opt.value))}}else{input=document.createElement('input');input.type=f.kind==='number'?'number':'text';if(f.kind==='number')input.step='1';if(f.kind==='bool'){input=document.createElement('select');input.add(new Option('true','True'));input.add(new Option('false','False'))}}input.value=String(f.value);input.onchange=()=>{if(input.value===String(f.value))fieldsChanged.delete(f.key);else fieldsChanged.set(f.key,input.value);count()};box.append(label,small,input);grid.append(box)}section.append(grid);container.append(section)}}
function renderFields(){renderFieldGroups('fieldGroups',data.fields.filter(f=>!f.key.startsWith('Villager')))}
function renderVillager(){if(!data)return;const container=$('villagerFields');container.replaceChildren();const ids=[...new Set(data.fields.map(f=>f.key.match(/^Villager(\d+)\./)?.[1]).filter(x=>x!==undefined))].sort((a,b)=>Number(a)-Number(b));for(const id of ids){const fields=data.fields.filter(f=>f.key.startsWith(`Villager${id}.`)),species=fields.find(f=>f.key.endsWith('.Species')),personality=fields.find(f=>f.key.endsWith('.Personality'));const card=document.createElement('details');card.className='villager-card';const summary=document.createElement('summary'),name=document.createElement('span'),trait=document.createElement('small');name.className='villager-name';name.textContent=species?.value==='255'?`空位 ${Number(id)+1}`:(species?.display||`村民 ${Number(id)+1}`);trait.textContent=personality?.display||'';summary.append(name,trait);const editor=document.createElement('div');editor.className='villager-card-fields';card.append(summary,editor);container.append(card);renderFieldGroups(editor,fields,true)}}
function renderInventory(){
 const name=$('inventory').value,arr=data.inventories[name]||[],pages=Math.max(1,Math.ceil(arr.length/40)),old=Number($('page').value)||0;
 $('page').replaceChildren(...Array.from({length:pages},(_,i)=>new Option(`${i+1} / ${pages}`,i)));$('page').value=Math.min(old,pages-1);$('itemRows').replaceChildren();
 for(const original of arr.slice(Number($('page').value)*40,(Number($('page').value)+1)*40)){
  const key=name+':'+original.index,item=itemsChanged.get(key)||original,tr=document.createElement('tr'),num=document.createElement('td');num.textContent=original.index+1;tr.append(num);
  const nameCell=document.createElement('td');nameCell.textContent=item.name||'未知物品';tr.append(nameCell);
  const idCell=document.createElement('td');tr.append(idCell);
  const countCell=document.createElement('td');tr.append(countCell);
  const usesCell=document.createElement('td');tr.append(usesCell);
  const makeInput=(field,min,max,onchange)=>{const input=document.createElement('input');input.type='number';input.min=min;input.max=max;input.step=1;input.value=item[field];input.setAttribute('aria-label',field);input.onchange=()=>{const n=Number(input.value);if(!Number.isInteger(n)||n<min||n>max){input.value=item[field];msg('数值超出允许范围。',true);return}const updated={...(itemsChanged.get(key)||original),[field]:n};updated.changedFields=[...new Set([...(updated.changedFields||[]),field])];if(updated[field]===original[field])updated.changedFields=updated.changedFields.filter(x=>x!==field);if(updated.changedFields.length===0)itemsChanged.delete(key);else itemsChanged.set(key,updated);if(onchange)onchange(n,updated);count()};return input};
  const itemIdInput=makeInput('itemId',0,65535,(n,updated)=>fetch('/api/itemname/'+n).then(r=>r.json()).then(meta=>{Object.assign(updated,meta);nameCell.textContent=meta.name||'未知物品';renderInventory()}));idCell.append(itemIdInput);
  const fillMeaningful=(current)=>{countCell.replaceChildren();usesCell.replaceChildren();if(current.hasCount)countCell.append(makeInput('count',0,current.maxCount));else countCell.textContent='—';if(current.hasUses)usesCell.append(makeInput('useCount',0,65535));else usesCell.textContent='—';};
  fillMeaningful(item);
  $('itemRows').append(tr)
 }
}
$('inventory').onchange=()=>{$('page').value=0;renderInventory()};$('page').onchange=renderInventory;
function filteredRecipes(){const query=$('recipeSearch').value.trim().toLocaleLowerCase();return data.recipes.filter(r=>!query||r.name.toLocaleLowerCase().includes(query)||String(r.index).includes(query))}
function renderRecipes(){const arr=filteredRecipes();$('recipeRows').replaceChildren();for(const original of arr){const current=recipesChanged.get(original.index)||original,tr=document.createElement('tr'),id=document.createElement('td');id.textContent=original.index;const nm=document.createElement('td');nm.textContent=original.name;tr.append(nm,id);for(const field of ['known','made','new','favorite']){const td=document.createElement('td'),input=document.createElement('input');input.type='checkbox';input.style.width='auto';input.checked=current[field];input.onchange=()=>{const changed={...(recipesChanged.get(original.index)||original),[field]:input.checked};if(['known','made','new','favorite'].every(k=>changed[k]===original[k]))recipesChanged.delete(original.index);else recipesChanged.set(original.index,changed);count()};td.append(input);tr.append(td)}$('recipeRows').append(tr)}}
function setRecipeBulk(mode){const field=$('recipeBulkField').value;for(const original of filteredRecipes()){const current=recipesChanged.get(original.index)||original;const value=mode==='invert'?!current[field]:mode==='all';const changed={...current,[field]:value};if(['known','made','new','favorite'].every(k=>changed[k]===original[k]))recipesChanged.delete(original.index);else recipesChanged.set(original.index,changed)}renderRecipes();count()}
$('recipeSearch').oninput=renderRecipes;$('expandRecipes').onclick=()=>{$('recipeSearch').value='';renderRecipes()};$('recipeSelectAll').onclick=()=>setRecipeBulk('all');$('recipeInvert').onclick=()=>setRecipeBulk('invert');$('recipeClear').onclick=()=>setRecipeBulk('none');
$('resetFields').onclick=()=>{if(window.confirm('恢复玩家与岛屿页面到刚读取存档时的状态？')){for(const key of [...fieldsChanged.keys()])if(!key.startsWith('Villager'))fieldsChanged.delete(key);renderFields();count()}};
$('resetVillager').onclick=()=>{if(window.confirm('恢复全部村民到刚读取存档时的状态？')){for(const key of [...fieldsChanged.keys()])if(key.startsWith('Villager'))fieldsChanged.delete(key);renderVillager();count()}};
$('resetInventory').onclick=()=>{const area=$('inventory').value;if(window.confirm('恢复当前物品区域到刚读取存档时的状态？')){for(const key of [...itemsChanged.keys()])if(key.startsWith(area+':'))itemsChanged.delete(key);renderInventory();count()}};
$('resetRecipes').onclick=()=>{if(window.confirm('恢复所有配方到刚读取存档时的状态？')){recipesChanged.clear();renderRecipes();count()}};
for(const tab of document.querySelectorAll('[data-tab]'))tab.onclick=()=>{for(const b of document.querySelectorAll('[data-tab]'))b.classList.toggle('active',b===tab);for(const panel of ['fields','villagers','items','recipes'])$(panel+'Panel').classList.toggle('hidden',tab.dataset.tab!==panel)};
function count(){const n=fieldsChanged.size+itemsChanged.size+recipesChanged.size;$('changeCount').textContent=n?`待保存 ${n} 项改动`:'尚无改动';$('save').disabled=!n||data.invalidHashes>0}
$('save').onclick=async()=>{if(!window.confirm(`将生成一份新存档，不会覆盖源文件。\n\n如果之后要用它替换游戏里的旧存档，请先备份旧存档。\n\n继续保存？`))return;try{const fields=[...fieldsChanged].map(([key,value])=>({key,value})),items=[...itemsChanged].map(([key,item])=>({inventory:key.split(':')[0],index:item.index,itemId:item.itemId,count:item.changedFields?.includes('count')?item.count:null,useCount:item.changedFields?.includes('useCount')?item.useCount:null}));const recipes=[...recipesChanged.values()];const result=await post('/api/editor/save',{path:basic.path,player:Number($('player').value),fields,items,recipes});msg('已保存新存档：\n'+result.destination);if(window.confirm('存档已保存到：\n'+result.destination+'\n\n是否在 Finder 中显示此存档？')){await post('/api/reveal',{path:result.destination});msg('已在 Finder 中显示存档位置：\n'+result.destination)}fieldsChanged.clear();itemsChanged.clear();recipesChanged.clear();count()}catch(e){msg(e.message,true)}};
</script></html>
